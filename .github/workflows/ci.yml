name: CI

on:
  pull_request:
    branches:
      - main
      - feature/runtime-intelligence
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  science-color-v8-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONHASHSEED: 20260822
      ORT_DISABLE_TELEMETRY_EVENTS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup frozen Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: scripts/intelligence/requirements-color-v8-runtime.txt

      - name: Install frozen ONNX Runtime environment
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            --requirement scripts/intelligence/requirements-color-v8-runtime.txt
          python -m pip check

      - name: Test preprocessing, policy and closed output
        run: |
          python -m py_compile scripts/intelligence/color_v8/run_color_v8_onnx.py
          python -m unittest -v tests/Python/test_color_v8_runtime.py

  science-cancellation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      MPLCONFIGDIR: /tmp/rentfleet-matplotlib
      PYTHONHASHSEED: "20260814"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Python runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          if sys.version_info[:2] != (3, 12):
              raise SystemExit(f"Python 3.12 required, got {sys.version}")
          PY

      - name: Install frozen cancellation environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cancellation-venv"
          "$RUNNER_TEMP/cancellation-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --only-binary=:all: \
            -r requirements/science-cancellation.lock
          "$RUNNER_TEMP/cancellation-venv/bin/python" -m pip check

      - name: Verify cancellation qualification evidence
        shell: bash
        run: |
          "$RUNNER_TEMP/cancellation-venv/bin/python" -m unittest -v \
            tests/Python/test_cancellation_risk_qualification.py
          "$RUNNER_TEMP/cancellation-venv/bin/python" -m py_compile \
            scripts/intelligence/train_cancellation_risk.py
          cd docs/evidence/intelligence/cancellation-risk
          sha256sum --check SHA256SUMS

  science-fleet-reallocation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONHASHSEED: 20260814

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup frozen Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: scripts/intelligence/requirements-fleet-reallocation.txt

      - name: Install frozen OR-Tools environment
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-input \
            --requirement scripts/intelligence/requirements-fleet-reallocation.txt
          python -m pip check

      - name: Execute preregistered qualification
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fleet-reallocation"
          python -m pip freeze --all > "$RUNNER_TEMP/fleet-reallocation/requirements-frozen.txt"
          python scripts/intelligence/qualify_fleet_reallocation.py \
            --output "$RUNNER_TEMP/fleet-reallocation"

      - name: Verify frozen evidence checksums
        working-directory: ${{ runner.temp }}/fleet-reallocation
        run: sha256sum --check SHA256SUMS

      - name: Reproduce synthetic consultative demo chain
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consultative-demo"
          python scripts/intelligence/build_consultative_demo.py \
            --output "$RUNNER_TEMP/consultative-demo"
          (cd "$RUNNER_TEMP/consultative-demo" && sha256sum --check SHA256SUMS)
          diff --recursive --brief \
            docs/evidence/intelligence/consultative-demo \
            "$RUNNER_TEMP/consultative-demo"

      - name: Upload preregistered qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fleet-reallocation-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/fleet-reallocation/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

      - name: Test protocol, baselines, solver and reproducibility
        run: |
          python -m unittest -v \
            tests/Python/test_fleet_reallocation_qualification.py \
            tests/Python/test_consultative_demo.py \
            tests/Python/test_fleet_reallocation_runtime.py \
            tests/Python/test_demand_forecast_j15b_evidence.py \
            tests/Python/test_s6_scientific_dossier.py

      - name: Verify HGB J15-B evidence checksums
        working-directory: docs/evidence/intelligence/demand-forecast
        run: sha256sum --check SHA256SUMS

      - name: Verify STOP S6 dossier checksums
        working-directory: docs/evidence/intelligence
        run: sha256sum --check S6_SHA256SUMS

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CI: true
      APP_ENV: testing
      APP_DEBUG: false
      APP_TIMEZONE: Africa/Casablanca
      PGTZ: Africa/Casablanca
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rentfleet_test
      DB_USERNAME: rentfleet_app
      DB_PASSWORD: rentfleet-ci-${{ github.run_id }}-${{ github.run_attempt }}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: rentfleet_test
          POSTGRES_USER: rentfleet_app
          POSTGRES_PASSWORD: rentfleet-ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentfleet_app -d rentfleet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5.8
          tools: composer:2.10.1
          extensions: mbstring, intl, dom, fileinfo, pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure PowerShell compatibility
        shell: bash
        run: |
          pwsh_path="$(command -v pwsh)"
          test -n "$pwsh_path"
          mkdir -p "$RUNNER_TEMP/powershell-compat"
          ln -s "$pwsh_path" "$RUNNER_TEMP/powershell-compat/powershell.exe"
          echo "$RUNNER_TEMP/powershell-compat" >> "$GITHUB_PATH"

      - name: Create runner environment file
        run: cp .env.example .env

      - name: Validate Composer configuration
        run: composer validate --strict --no-interaction

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit

      - name: Validate demand adapter contracts
        shell: bash
        run: |
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          ast.parse(Path('scripts/intelligence/run_demand_forecast.py').read_text(encoding='utf-8'))
          json.loads(Path('docs/intelligence/schemas/demand-forecast-result-v1.0.0.json').read_text(encoding='utf-8'))
          requirements = Path('scripts/intelligence/requirements-demand-forecast.txt').read_text(encoding='utf-8').splitlines()
          assert requirements == [
              'numpy==2.0.2',
              'pandas==2.2.2',
              'scikit-learn==1.6.1',
              'joblib==1.5.3',
          ]
          PY

      - name: Install frozen demand adapter environment
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/demand-forecast-venv"
          "$RUNNER_TEMP/demand-forecast-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --requirement scripts/intelligence/requirements-demand-forecast.txt

      - name: Test demand adapter preprocessing and payload
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          "$RUNNER_TEMP/demand-forecast-venv/bin/python" \
            -m unittest \
            tests/Python/test_demand_forecast_adapter.py \
            tests/Python/test_demand_forecast_authentic_artifact.py

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Apply database migrations
        run: php artisan migrate --force --no-interaction

      - name: Run test suite
        run: php artisan test --log-junit "$RUNNER_TEMP/j15-tests.xml"

      - name: Run deployment diagnostics
        shell: bash
        run: |
          set -o pipefail
          php artisan rentfleet:doctor --json --env=testing --expect-database=rentfleet_test \
            | tee "$RUNNER_TEMP/j15-doctor.json"

      - name: Check Git diff
        run: git diff --check

      - name: Generate J15-A release evidence
        run: |
          php artisan intelligence:j15-release-evidence \
            --source-commit="${GITHUB_SHA}" \
            --repository="${GITHUB_REPOSITORY}" \
            --junit="${RUNNER_TEMP}/j15-tests.xml" \
            --doctor="${RUNNER_TEMP}/j15-doctor.json" \
            --output="${RUNNER_TEMP}/j15-release-evidence"

      - name: Verify J15-A release evidence checksums
        working-directory: ${{ runner.temp }}/j15-release-evidence
        run: sha256sum --check SHA256SUMS

      - name: Upload J15-A release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: j15-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/j15-release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  attest-release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download J15-A release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: j15-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/j15-release-evidence

      - name: Re-verify J15-A release evidence checksums
        working-directory: ${{ runner.temp }}/j15-release-evidence
        run: sha256sum --check SHA256SUMS

      - name: Attest J15-A release evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/j15-release-evidence/SHA256SUMS
