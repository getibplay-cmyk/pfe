name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CI: true
      APP_ENV: testing
      APP_DEBUG: false
      APP_TIMEZONE: Africa/Casablanca
      PGTZ: Africa/Casablanca
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: rentfleet_test
      DB_USERNAME: rentfleet_app
      DB_PASSWORD: rentfleet_ci_only
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: 4

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: rentfleet_test
          POSTGRES_USER: rentfleet_app
          POSTGRES_PASSWORD: rentfleet_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rentfleet_app -d rentfleet_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup PHP and Composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.5.8
          tools: composer:2.10.1
          extensions: mbstring, intl, dom, fileinfo, pdo_pgsql, pgsql
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure PowerShell compatibility
        shell: bash
        run: |
          pwsh_path="$(command -v pwsh)"
          test -n "$pwsh_path"
          mkdir -p "$RUNNER_TEMP/powershell-compat"
          ln -s "$pwsh_path" "$RUNNER_TEMP/powershell-compat/powershell.exe"
          echo "$RUNNER_TEMP/powershell-compat" >> "$GITHUB_PATH"

      - name: Create runner environment file
        run: cp .env.example .env

      - name: Validate Composer configuration
        run: composer validate --strict --no-interaction

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Audit Composer dependencies
        run: composer audit --locked --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Audit npm dependencies
        run: npm audit

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Apply database migrations
        run: php artisan migrate --force --no-interaction

      - name: Run test suite
        run: php artisan test --log-junit "$RUNNER_TEMP/j15-tests.xml"

      - name: Run deployment diagnostics
        shell: bash
        run: |
          set -o pipefail
          php artisan rentfleet:doctor --json --env=testing --expect-database=rentfleet_test \
            | tee "$RUNNER_TEMP/j15-doctor.json"

      - name: Check Git diff
        run: git diff --check

      - name: Generate J15-A release evidence
        run: |
          php artisan intelligence:j15-release-evidence \
            --source-commit="${GITHUB_SHA}" \
            --repository="${GITHUB_REPOSITORY}" \
            --junit="${RUNNER_TEMP}/j15-tests.xml" \
            --doctor="${RUNNER_TEMP}/j15-doctor.json" \
            --output="${RUNNER_TEMP}/j15-release-evidence"

      - name: Verify J15-A release evidence checksums
        working-directory: ${{ runner.temp }}/j15-release-evidence
        run: sha256sum --check SHA256SUMS

      - name: Upload J15-A release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: j15-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/j15-release-evidence/
          if-no-files-found: error
          retention-days: 30
          compression-level: 9

  attest-release-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download J15-A release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: j15-release-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/j15-release-evidence

      - name: Re-verify J15-A release evidence checksums
        working-directory: ${{ runner.temp }}/j15-release-evidence
        run: sha256sum --check SHA256SUMS

      - name: Attest J15-A release evidence provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: ${{ runner.temp }}/j15-release-evidence/SHA256SUMS
