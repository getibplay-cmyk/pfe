name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Python for analysis tools only
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.13
      - name: Install pinned analysis tools in disposable runner
        run: python -m pip install --disable-pip-version-check --no-input 'semgrep==1.177.0'
      - name: Verify rules and scan authored PHP, JavaScript and Python
        env:
          SEMGREP_SEND_METRICS: 'off'
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          semgrep scan --validate --config .github/security/semgrep.yml --metrics=off
          semgrep scan --config .github/security/semgrep.yml --metrics=off \
            --disable-version-check --error --strict --timeout 10 --max-memory 1000 \
            --sarif --output "$RUNNER_TEMP/semgrep.sarif" \
            app bootstrap routes resources/js scripts/intelligence
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 60 --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan history with fully redacted output
        run: |
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" git . --redact=100 \
            --log-opts=--all --report-format=json --report-path="$RUNNER_TEMP/gitleaks.json"
      - name: Verify reference coverage and create locked-component SBOM
        run: |
          python scripts/security/check_control_register.py
          python scripts/security/build_sbom.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/sbom.cdx.json"
      - name: Retain analysis evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-analysis-${{ github.sha }}
          path: |
            ${{ runner.temp }}/semgrep.sarif
            ${{ runner.temp }}/gitleaks.json
            ${{ runner.temp }}/sbom.cdx.json
          retention-days: 14
          if-no-files-found: warn
